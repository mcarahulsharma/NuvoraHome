name: Build and publish Nuvora Home TV launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tizen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Tizen package
        run: |
          test -f config.xml
          test -f index.html
          test -f icon.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("config.xml")
          print("Tizen descriptor is valid XML")
          PY
      - name: Build unsigned WGT
        run: |
          mkdir -p dist
          zip -X -r dist/NuvoraHome.wgt config.xml index.html icon.svg manifest.webmanifest sw.js
          unzip -t dist/NuvoraHome.wgt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvoraHome-TV-Launcher
          path: dist/NuvoraHome.wgt
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest installable package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nuvorahome-latest
          name: Nuvora Home - Samsung TV Launcher
          body: |
            Fresh launcher build for Samsung Tizen TVs.
            Download NuvoraHome.wgt and install using Apps2Samsung.
          files: dist/NuvoraHome.wgt
          overwrite_files: true
          make_latest: true
